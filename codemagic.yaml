  # iOS workflow
  ios-build:
    name: iOS Build
    environment:
      # flutter: stable
      flutter: 3.38.0
      xcode: latest
      cocoapods: default
      groups:
        - firebase
        - google
      vars:
        BUNDLE_ID: "com.ay.sudokulegend" # 👈 Change this
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Generate iOS project files
        script: |
          cd $FCI_BUILD_DIR
          # Check if ios/ folder or Podfile is missing
          if [ ! -f "ios/Podfile" ]; then
            echo "⚠️ Podfile not found, generating iOS project..."
            flutter create --platforms=ios .
            echo "✅ iOS project generated"
          else
            echo "✅ Podfile already exists, skipping"
          fi

      - name: Decode Firebase Configs
        script: |
          set -e
          echo "🔄 Restoring Firebase config files..."
          echo $FIREBASE | base64 --decode > $FCI_BUILD_DIR/firebase.json
          echo $FIREBASE_OPTIONS | base64 --decode > $FCI_BUILD_DIR/lib/firebase_options.dart
          echo $IOS_FIREBASE_CONFIG | base64 --decode > $FCI_BUILD_DIR/ios/Runner/GoogleService-Info.plist
          echo $ENV | base64 --decode > $FCI_BUILD_DIR/.env
          echo "✅ Firebase files restored"

      # - name: Set up iOS code signing
      #   script: |
      #     # Installs the certificate & provisioning profile stored as
      #     # Codemagic environment variables (set these in the UI):
      #     #   IOS_CERTIFICATE        — base64 of your .p12
      #     #   IOS_CERTIFICATE_PASSWORD
      #     #   IOS_PROVISIONING_PROFILE — base64 of your .mobileprovision
      #     keychain initialize
      #     echo $IOS_CERTIFICATE | base64 --decode > /tmp/cert.p12
      #     keychain add-certificates --certificate /tmp/cert.p12 \
      #       --certificate-password $IOS_CERTIFICATE_PASSWORD
      #     echo $IOS_PROVISIONING_PROFILE | base64 --decode > /tmp/profile.mobileprovision
      #     xcode-project use-profiles --profile /tmp/profile.mobileprovision

      - name: Install CocoaPods
        script: |
          cd $FCI_BUILD_DIR/ios

          python3 - <<'PYEOF'
          with open("Podfile", "r") as f:
              content = f.read()

          # 1. Uncomment the platform line (remove the # )
          content = content.replace("# platform :ios, '12.0'", "platform :ios, '13.0'")
          content = content.replace("# platform :ios, '13.0'", "platform :ios, '13.0'")
          content = content.replace("platform :ios, '12.0'", "platform :ios, '13.0'")

          # 2. Patch the post_install block
          old = "flutter_additional_ios_build_settings(target)"
          new = """flutter_additional_ios_build_settings(target)
              target.build_configurations.each do |config|
                config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
              end"""

          if old in content and "IPHONEOS_DEPLOYMENT_TARGET" not in content:
              content = content.replace(old, new)

          with open("Podfile", "w") as f:
              f.write(content)

          print("✅ Podfile patched successfully")
          PYEOF

          echo "📄 Final Podfile:"
          cat Podfile

          # Verify platform line is active before running pod install
          if ! grep -q "^platform :ios, '13.0'" Podfile; then
            echo "❌ Platform line not set correctly!"
            exit 1
          fi

          echo "✅ Platform verified, running pod install..."
          pod install

      # - name: Install CocoaPods
      #   script: |
      #     cd ios
      #     pod install

      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      # Optional: publish to App Store Connect
      # app_store_connect:
      #   api_key: $APP_STORE_CONNECT_PRIVATE_KEY
      #   key_id: $APP_STORE_CONNECT_KEY_ID
      #   issuer_id: $APP_STORE_CONNECT_ISSUER_ID
      email:
        recipients:
          - aregbeayomide@gmail.com
        notify:
          success: true
          failure: true
