workflows:
  # ─────────────────────────────────────────
  # ANDROID WORKFLOW
  # ─────────────────────────────────────────
  android-build:
    name: Android Build
    environment:
      flutter: stable
      groups:
        - firebase
        - keystore
        - google
      vars:
        PACKAGE_NAME: "com.ay.sudokulegend"

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches

    scripts:
      - name: Decode Firebase Configs
        script: |
          set -e
          echo "🔄 Restoring Firebase config files..."
          echo $FIREBASE | base64 --decode > $FCI_BUILD_DIR/firebase.json
          echo $FIREBASE_OPTIONS | base64 --decode > $FCI_BUILD_DIR/lib/firebase_options.dart
          echo $ANDROID_FIREBASE_CONFIG | base64 --decode > $FCI_BUILD_DIR/android/app/google-services.json
          echo $ENV | base64 --decode > $FCI_BUILD_DIR/.env
          if [ ! -s "$FCI_BUILD_DIR/lib/firebase_options.dart" ]; then
            echo "❌ firebase_options.dart is missing or empty!"
            exit 1
          fi
          echo "✅ Firebase files restored"

      - name: Decode Keystore
        script: |
          set -e
          echo "🔑 Restoring keystore..."
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "❌ ANDROID_KEYSTORE env var is not set!"
            exit 1
          fi
          echo $ANDROID_KEYSTORE | base64 --decode > $FCI_BUILD_DIR/android/app/sudokulegend-keystore.jks
          cat > $FCI_BUILD_DIR/android/key.properties <<KEYEOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=sudokulegend-keystore.jks
          KEYEOF
          echo "✅ Keystore restored"

      - name: Flutter Pub Get
        script: flutter pub get

      - name: Build Android App Bundle
        script: flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - aregbeayomide@gmail.com
        notify:
          success: true
          failure: true


